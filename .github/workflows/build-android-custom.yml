name: Build custom Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply my patch
        run: git apply --verbose fladder-android-fixes.patch

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.35.7"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (arm64, debug-signed)
        run: flutter build apk --debug --target-platform android-arm64 --flavor production

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fladder-custom-apk
          path: build/app/outputs/flutter-apk/*.apk

